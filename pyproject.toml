[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vase-stress"
version = "0.1.0"
description = "Local GLB to VTU finite element analysis and stress visualization"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "trimesh>=4.5,<6", "meshio>=5.3,<6"]

[project.scripts]
vase-stress = "vase_stress.cli:main"

[tool.setuptools.packages.find]
include = ["vase_stress*"]
